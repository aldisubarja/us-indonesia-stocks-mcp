[project]
name = "indonesia-stocks-mcp"
version = "0.2.0"
description = "MCP server for Indonesian stock fundamentals via Yahoo Finance — financial statements, key metrics, prices, and dividends. Install with uvx."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
]

[project.scripts]
indonesia-stocks-mcp = "indonesia_stocks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indonesia_stocks_mcp"]
