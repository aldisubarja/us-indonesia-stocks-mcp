[project]
name = "indonesia-stocks-mcp"
version = "0.1.0"
description = "MCP server for Indonesian stock fundamentals — income statement, balance sheet, cash flow, ratios from IDX, RTI, and Yahoo Finance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "yfinance>=0.2.40",
]

[project.scripts]
indonesia-stocks-mcp = "indonesia_stocks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indonesia_stocks_mcp"]
